<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Resume Analyzer — Get an instant ATS score and expert improvement suggestions for your resume.">
  <meta name="theme-color" content="#0a0a0f">

  <title>ResumeAI — AI-Powered Resume Analyzer</title>

  <!-- Favicon (inline SVG data URI) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a0a0f'/><text x='16' y='22' font-size='18' text-anchor='middle' fill='%23d4af37'>✦</text></svg>">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- PDF.js from CDN (for client-side PDF text extraction) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <!-- App root — all pages are rendered here by the JS router -->
  <div id="app" style="transition:opacity 0.35s ease"></div>

  <!-- Core app scripts -->
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>

  <!-- Configure PDF.js worker -->
  <script>
    // Point PDF.js to its worker file on the CDN
    if (typeof pdfjsLib !== 'undefined') {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

</body>
</html>
